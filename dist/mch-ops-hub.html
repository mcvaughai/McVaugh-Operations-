function ReviewDocument({doc}) {
const lines=doc.markdown.split('\n');const nodes=[];let rows=[];
const flush=()=>{if(!rows.length)return;const r=rows;rows=[];nodes.push(<div key={'t'+nodes.length} style={{overflowX:'auto',margin:'14px 0'}}><table style={{borderCollapse:'collapse',width:'100%',minWidth:640}}><tbody>{r.map((cells,i)=><tr key={i}>{cells.map((c,j)=><td key={j} style={{padding:10,borderBottom:'1px solid #475569',verticalAlign:'top',fontSize:13,fontWeight:i===0?600:400}}>{c.replace(/\*\*/g,'')}</td>)}</tr>)}</tbody></table></div>);};
for(const l of lines){if(l.startsWith('|')){if(!/^\|[\s|:-]+$/.test(l))rows.push(l.split('|').slice(1,-1));continue;}flush();if(!l.trim())continue;const text=l.replace(/^#+\s*/, '').replace(/\*\*/g,'');nodes.push(l.startsWith('#')?<h3 key={nodes.length} style={{margin:'22px 0 10px',color:'#FBBF24'}}>{text}</h3>:<p key={nodes.length} style={{lineHeight:1.6,margin:'8px 0',fontSize:14}}>{text}</p>);}flush();
return <details open style={{marginBottom:22,border:'1px solid #475569',borderRadius:12,padding:20}}><summary style={{cursor:'pointer',fontSize:19,fontWeight:600}}>{doc.title}</summary>{nodes}</details>;
}

    r.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
    r.department.toLowerCase().includes(searchTerm.toLowerCase())
  );

  const updateRoleName = (roleId, newName) => {
    setRoles(prev => prev.map(r => r.id === roleId ? { ...r, name: newName } : r));

  };

  return (
    <div style={{
      minHeight: "100vh",
      background: "linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%)",
      color: "#E2E8F0",
      fontFamily: "'DM Sans', 'Segoe UI', system-ui, sans-serif",
    }}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

      {/* Header */}
      <header style={{
        background: "rgba(15, 23, 42, 0.8)",
        backdropFilter: "blur(20px)",
        borderBottom: "1px solid rgba(148, 163, 184, 0.1)",
        padding: "16px 24px",
        position: "sticky",
        top: 0,
        zIndex: 100,
      }}>
        <div style={{ maxWidth: 1400, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{
              width: 40, height: 40,
              background: "linear-gradient(135deg, #F59E0B, #D97706)",
              borderRadius: 10,
              display: "flex", alignItems: "center", justifyContent: "center",
              fontFamily: "'Space Mono', monospace",
              fontWeight: 700, fontSize: 16, color: "#0F172A"
            }}>
              MCH
            </div>
            <div>
              <h1 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: "#F8FAFC", letterSpacing: "-0.02em" }}>
                McVaugh Custom Homes
              </h1>
              <p style={{ margin: 0, fontSize: 11, color: "#94A3B8", fontFamily: "'Space Mono', monospace", textTransform: "uppercase", letterSpacing: "0.1em" }}>
                Operations Hub
              </p>
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
            {/* Org Mode Toggle */}
            <div style={{
              display: "flex", gap: 2, background: "rgba(15, 23, 42, 0.8)", borderRadius: 8, padding: 3,
              border: "1px solid rgba(148, 163, 184, 0.1)",
            }}>
              <button
                onClick={() => { setOrgMode("current"); setSelectedRole(null); setSelectedProcess(null); setSelectedCurrentMember(null); setView("dashboard"); }}
                style={{
                  padding: "6px 12px", border: "none", borderRadius: 6, cursor: "pointer",
                  fontSize: 11, fontFamily: "'Space Mono', monospace", fontWeight: 600,
                  background: orgMode === "current" ? "rgba(16, 185, 129, 0.25)" : "transparent",
                  color: orgMode === "current" ? "#10B981" : "#64748B",
                  transition: "all 0.2s",
                }}

                CURRENT (8)

              <button
                onClick={() => { setOrgMode("full"); setSelectedRole(null); setSelectedProcess(null); setSelectedCurrentMember(null); setView("dashboard"); }}
                style={{
                  padding: "6px 12px", border: "none", borderRadius: 6, cursor: "pointer",
                  fontSize: 11, fontFamily: "'Space Mono', monospace", fontWeight: 600,
                  background: orgMode === "full" ? "rgba(245, 158, 11, 0.25)" : "transparent",
                  color: orgMode === "full" ? "#F59E0B" : "#64748B",
                  transition: "all 0.2s",
                }}
              >
                FULL ORG (16)
              </button>
            </div>

            {/* ROCC Toggle */}
            <button
              onClick={() => setShowROCC(!showROCC)}
              style={{
                padding: "6px 12px", borderRadius: 6, cursor: "pointer",
                fontSize: 10, fontFamily: "'Space Mono', monospace", fontWeight: 600,
                background: showROCC ? "rgba(168, 85, 247, 0.25)" : "rgba(30, 41, 59, 0.6)",
                color: showROCC ? "#A855F7" : "#475569",
                border: showROCC ? "1px solid rgba(168, 85, 247, 0.3)" : "1px solid rgba(148, 163, 184, 0.1)",
                transition: "all 0.2s",
              }}
              title="Toggle Royal Oaks Country Club items on/off"
            >
              {showROCC ? "ROCC ●" : "ROCC ○"}
            </button>

            {/* N/A Toggle */}
            <button
              onClick={() => setShowNA(!showNA)}
              style={{
                padding: "6px 12px", borderRadius: 6, cursor: "pointer",
                fontSize: 10, fontFamily: "'Space Mono', monospace", fontWeight: 600,
                background: showNA ? "rgba(239, 68, 68, 0.25)" : "rgba(30, 41, 59, 0.6)",
                color: showNA ? "#EF4444" : "#475569",
                border: showNA ? "1px solid rgba(239, 68, 68, 0.3)" : "1px solid rgba(148, 163, 184, 0.1)",
                transition: "all 0.2s",
              }}

            >
              {showNA ? "N/A ●" : "N/A ○"}
            </button>

            <nav style={{ display: "flex", gap: 4, background: "rgba(30, 41, 59, 0.8)", borderRadius: 10, padding: 4 }}>
            {[
              { id: "dashboard", label: "Dashboard", icon: "◉" },
              { id: "roles", label: "Team", icon: "◎" },
              { id: "processes", label: "SOPs", icon: "◈" },
              { id: "matrix", label: "Matrix", icon: "◇" },
              { id: "review", label: "Current review", icon: "☑" }
    ].map(tab => (
              <button
                key={tab.id}
                onClick={() => { setView(tab.id); setSelectedRole(null); setSelectedProcess(null); }}
                style={{
                  padding: "8px 16px",
                  border: "none",
                  borderRadius: 8,
                  cursor: "pointer",
                  fontSize: 13,
                  fontWeight: view === tab.id ? 600 : 400,
                  fontFamily: "inherit",
                  background: view === tab.id ? "rgba(245, 158, 11, 0.2)" : "transparent",
                  color: view === tab.id ? "#F59E0B" : "#94A3B8",
                  transition: "all 0.2s",
                }}
              >
                <span style={{ marginRight: 6 }}>{tab.icon}</span>{tab.label}
              </button>
            ))}
          </nav>
          </div>
        </div>
      </header>

      <main style={{ maxWidth: 1400, margin: "0 auto", padding: "24px 24px 80px" }}>
        <div style={{padding:'12px 16px',marginBottom:18,background:'#1E293B',borderLeft:'4px solid #F59E0B',lineHeight:1.6}}>Updated November 4, 2026 · Maria leaves November 6 · <button onClick={()=>setView('review')} style={{background:'transparent',color:'#FBBF24',border:0,textDecoration:'underline',cursor:'pointer'}}>Open transition and Landing review</button><br/><span style={{fontSize:12,color:'#CBD5E1'}}>Assignments are not accepted handoffs. Open items require evidence. Name edits in this page are session-only; they do not save to the shared file.</span></div>
        {view === 'review' && <CurrentReview/>}
        {/* Mode Banner */}
        <div style={{
          marginBottom: 20, padding: "10px 16px", borderRadius: 10,
          background: orgMode === "current" ? "rgba(16, 185, 129, 0.08)" : "rgba(245, 158, 11, 0.08)",
          border: `1px solid ${orgMode === "current" ? "rgba(16, 185, 129, 0.15)" : "rgba(245, 158, 11, 0.15)"}`,

            <div style={{
              width: 8, height: 8, borderRadius: "50%",
              background: orgMode === "current" ? "#10B981" : "#F59E0B",
            }} />
            <span style={{ fontSize: 13, fontWeight: 600, color: orgMode === "current" ? "#10B981" : "#F59E0B" }}>
              {orgMode === "current" ? "Current Team View" : "Full Organization View"}
            </span>
            <span style={{ fontSize: 12, color: "#64748B" }}>
              {orgMode === "current"
                ? "— current assignments and legacy role references; handoff acceptance pending"
                : "— 16 positions at full staffing"}
            </span>
          </div>
        </div>

        {/* Search */}
        {(view === "roles" || view === "processes") && (
          <div style={{ marginBottom: 24, display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center" }}>
            <input
              type="text"
              placeholder={view === "roles" ? "Search team members..." : "Search procedures..."}
              value={searchTerm}
              onChange={e => setSearchTerm(e.target.value)}
              style={{
                flex: 1, minWidth: 200, padding: "10px 16px",
                background: "rgba(30, 41, 59, 0.8)",
                border: "1px solid rgba(148, 163, 184, 0.15)",
                borderRadius: 10, color: "#E2E8F0", fontSize: 14,
                fontFamily: "inherit", outline: "none",
              }}
            />
            {view === "processes" && (
              <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                {CATEGORIES.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setCategoryFilter(cat)}
                    style={{
                      padding: "8px 14px", border: "none", borderRadius: 8,
                      cursor: "pointer", fontSize: 12, fontFamily: "inherit",
                      fontWeight: categoryFilter === cat ? 600 : 400,
                      background: categoryFilter === cat ? "rgba(245, 158, 11, 0.2)" : "rgba(30, 41, 59, 0.5)",
                      color: categoryFilter === cat ? "#F59E0B" : "#94A3B8",
                    }}
                  >
                    {cat}
                  </button>
                ))}
              </div>
            )}
          </div>
        )}

        {/* ═══ CURRENT ORG MODE ═══ */}
        {orgMode === "current" && view === "dashboard" && (
          <CurrentDashboard
            team={currentTeam}
            processes={processes}
            roles={roles}
            onSelectMember={m => { setSelectedCurrentMember(m); setView("roles"); }}
            onSelectProcess={p => { setSelectedProcess(p); setView("processes"); }}
          />
        )}
        {orgMode === "current" && view === "roles" && !selectedCurrentMember && (
          <div>
            {/* Org Chart Visual */}
            <CurrentOrgChart team={currentTeam} onSelectMember={setSelectedCurrentMember} showROCC={showROCC} showRolesCovered={showRolesCovered} setShowRolesCovered={setShowRolesCovered} />
          </div>
        )}
        {orgMode === "current" && view === "roles" && selectedCurrentMember && (
          <CurrentMemberDetail
            member={selectedCurrentMember}
            team={currentTeam}
            roles={roles}
            processes={processes}
            onBack={() => setSelectedCurrentMember(null)}
            onSelectProcess={p => { setSelectedProcess(p); setView("processes"); }}
            showROCC={showROCC}
            showNA={showNA}
          />
        )}
        {orgMode === "current" && view === "processes" && !selectedProcess && (
          <ProcessGrid
            processes={filteredProcesses}
            roles={roles}
            onSelect={setSelectedProcess}
            currentTeam={currentTeam}
            orgMode={orgMode}
          />
        )}
        {orgMode === "current" && view === "processes" && selectedProcess && (
          <ProcessDetail
            process={selectedProcess}
            roles={roles}
            onBack={() => setSelectedProcess(null)}
            onSelectRole={r => { setSelectedRole(r); setView("roles"); }}
            currentTeam={currentTeam}
            orgMode={orgMode}
          />
        )}
        {orgMode === "current" && view === "matrix" && (
          <CurrentMatrixView team={currentTeam} processes={processes} roles={roles} onSelectMember={m => { setSelectedCurrentMember(m); setView("roles"); }} onSelectProcess={p => { setSelectedProcess(p); setView("processes"); }} />
        )}

        {/* ═══ FULL ORG MODE ═══ */}
        {orgMode === "full" && view === "dashboard" && (
          <DashboardView
            roles={roles}
            processes={processes}
            onSelectRole={r => { setSelectedRole(r); setView("roles"); }}
            onSelectProcess={p => { setSelectedProcess(p); setView("processes"); }}
          />
        )}

        {orgMode === "full" && view === "roles" && !selectedRole && (
          <RolesGrid
            roles={filteredRoles}
            processes={processes}
            onSelect={setSelectedRole}
            editingRole={editingRole}
            setEditingRole={setEditingRole}
            updateRoleName={updateRoleName}
          />
        )}
        {orgMode === "full" && view === "roles" && selectedRole && (
          <RoleDetail
            role={selectedRole}
            roles={roles}
            processes={processes}
            onBack={() => setSelectedRole(null)}
            onSelectProcess={p => { setSelectedProcess(p); setView("processes"); }}
            editingRole={editingRole}
            setEditingRole={setEditingRole}
            updateRoleName={updateRoleName}
          />
        )}

        {orgMode === "full" && view === "processes" && !selectedProcess && (
          <ProcessGrid
            processes={filteredProcesses}
            roles={roles}
            onSelect={setSelectedProcess}
          />
        )}
        {orgMode === "full" && view === "processes" && selectedProcess && (
          <ProcessDetail
            process={selectedProcess}
            roles={roles}
            onBack={() => setSelectedProcess(null)}
            onSelectRole={r => { setSelectedRole(r); setView("roles"); }}
          />
        )}

        {orgMode === "full" && view === "matrix" && (
          <MatrixView roles={roles} processes={processes} onSelectRole={r => { setSelectedRole(r); setView("roles"); }} onSelectProcess={p => { setSelectedProcess(p); setView("processes"); }} />
        )}
      </main>
    </div>
  );
}

// ─── Dashboard ───────────────────────────────────────
function DashboardView({ roles, processes, onSelectRole, onSelectProcess }) {
  const deptCounts = {};
  roles.forEach(r => { deptCounts[r.department] = (deptCounts[r.department] || 0) + 1; });

  return (
    <div>
      {/* Stats */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 16, marginBottom: 32 }}>
        {[
          { label: "Team Roles", value: roles.length, accent: "#F59E0B" },
          { label: "SOPs Documented", value: processes.length, accent: "#3B82F6" },
          { label: "Departments", value: DEPARTMENTS.length, accent: "#10B981" },
          { label: "Total Process Steps", value: processes.reduce((a, p) => a + p.steps.length, 0), accent: "#8B5CF6" }
    ].map((stat, i) => (
          <div key={i} onClick={stat.onClick || null} style={{
            background: "rgba(30, 41, 59, 0.6)",
            border: "1px solid rgba(148, 163, 184, 0.08)",
            borderRadius: 14, padding: "20px 24px",
            borderLeft: `3px solid ${stat.accent}`,
            cursor: stat.clickable ? "pointer" : "default",
            transition: "all 0.15s",
          }}>
            <div style={{ fontSize: 32, fontWeight: 700, color: stat.accent, fontFamily: "'Space Mono', monospace" }}>
              {stat.value}
            </div>
            <div style={{ fontSize: 13, color: "#94A3B8", marginTop: 4 }}>{stat.label}</div>
          </div>
        ))}
      </div>

      {/* Org Chart */}
      <div style={{
        background: "rgba(30, 41, 59, 0.6)",
        border: "1px solid rgba(148, 163, 184, 0.08)",
        borderRadius: 14, padding: 24, marginBottom: 32,
      }}>
        <h2 style={{ margin: "0 0 20px", fontSize: 18, fontWeight: 600, color: "#F8FAFC" }}>
          Organization by Department
        </h2>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 16 }}>
          {DEPARTMENTS.map(dept => {
            const deptRoles = roles.filter(r => r.department === dept.id);
            if (deptRoles.length === 0) return null;
            return (
              <div key={dept.id} style={{
                background: "rgba(15, 23, 42, 0.5)",
                borderRadius: 12, padding: 16,
                border: `1px solid ${dept.color}22`,
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                  <span style={{ fontSize: 20 }}>{dept.icon}</span>
                  <span style={{ fontSize: 13, fontWeight: 600, color: dept.color }}>{dept.id}</span>
                </div>
                {deptRoles.map(r => (
                  <button
                    key={r.id}
                    onClick={() => onSelectRole(r)}
                    style={{
                      display: "block", width: "100%", textAlign: "left",
                      padding: "8px 10px", marginBottom: 4,
                      background: "rgba(30, 41, 59, 0.5)",
                      border: "1px solid rgba(148, 163, 184, 0.06)",
                      borderRadius: 8, cursor: "pointer",
                      color: "#CBD5E1", fontSize: 12, fontFamily: "inherit",
                      transition: "all 0.15s",
                    }}
                    onMouseEnter={e => { e.target.style.background = `${r.color}15`; e.target.style.borderColor = `${r.color}33`; }}
                    onMouseLeave={e => { e.target.style.background = "rgba(30, 41, 59, 0.5)"; e.target.style.borderColor = "rgba(148, 163, 184, 0.06)"; }}
                  >
                    <div style={{ fontWeight: 500, fontSize: 12 }}>{r.title.length > 30 ? r.title.split("(")[0].trim() : r.title}</div>
                    {r.name && <div style={{ fontSize: 11, color: "#64748B", marginTop: 2 }}>{r.name}</div>}
                  </button>
                ))}
              </div>
            );
          })}
        </div>
      </div>

      {/* Quick Process Access */}
      <div style={{
        background: "rgba(30, 41, 59, 0.6)",
        border: "1px solid rgba(148, 163, 184, 0.08)",
        borderRadius: 14, padding: 24,
      }}>
        <h2 style={{ margin: "0 0 20px", fontSize: 18, fontWeight: 600, color: "#F8FAFC" }}>
          Standard Operating Procedures
        </h2>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: 12 }}>
          {processes.map(p => {
            const catColor = {
              Preconstruction: "#F59E0B",
              Construction: "#10B981",
              "Change Management": "#8B5CF6",
              Financial: "#3B82F6",
              Operations: "#EC4899",
              Sales: "#F472B6",
              Design: "#A855F7",
              "HR / Admin": "#FB923C",
            }[p.category] || "#94A3B8";
            return (
              <button
                key={p.id}
                onClick={() => onSelectProcess(p)}
                style={{
                  textAlign: "left", padding: 16,
                  background: "rgba(15, 23, 42, 0.5)",
                  border: "1px solid rgba(148, 163, 184, 0.06)",
                  borderRadius: 12, cursor: "pointer",
                  color: "#CBD5E1", fontFamily: "inherit",
                  transition: "all 0.15s",
                }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = `${catColor}44`; e.currentTarget.style.background = `${catColor}08`; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = "rgba(148, 163, 184, 0.06)"; e.currentTarget.style.background = "rgba(15, 23, 42, 0.5)"; }}
              >
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
                  <span style={{
                    fontSize: 10, fontFamily: "'Space Mono', monospace",
                    padding: "3px 8px", borderRadius: 6,
                    background: `${catColor}18`, color: catColor,
                    textTransform: "uppercase", letterSpacing: "0.05em",
                  }}>
                    {p.category}
                  </span>
                  <span style={{ fontSize: 11, color: "#64748B" }}>{p.steps.length} steps</span>
                </div>
                <div style={{ fontSize: 14, fontWeight: 600, color: "#E2E8F0", marginBottom: 6 }}>{p.name}</div>
                <div style={{ fontSize: 12, color: "#64748B", lineHeight: 1.4 }}>
                  Owner: {assignmentLabel(p)}
                </div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─── Roles Grid ──────────────────────────────────────
function RolesGrid({ roles, processes, onSelect, editingRole, setEditingRole, updateRoleName }) {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))", gap: 16 }}>
      {roles.map(role => {
        const roleProcesses = processes.filter(p => p.participants.includes(role.id));
        return (
          <div
            key={role.id}
            style={{
              background: "rgba(30, 41, 59, 0.6)",
              border: "1px solid rgba(148, 163, 184, 0.08)",
              borderRadius: 14, padding: 20,
              borderTop: `3px solid ${role.color}`,
              cursor: "pointer",
              transition: "all 0.2s",
            }}
            onClick={() => onSelect(role)}
            onMouseEnter={e => { e.currentTarget.style.borderColor = `${role.color}44`; e.currentTarget.style.transform = "translateY(-2px)"; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = "rgba(148, 163, 184, 0.08)"; e.currentTarget.style.transform = "none"; }}
          >
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
              <div>
                <div style={{ fontSize: 15, fontWeight: 600, color: "#F8FAFC", marginBottom: 4 }}>{role.title}</div>
                {editingRole === role.id ? (
                  <input
                    autoFocus
                    defaultValue={role.name}
                    onClick={e => e.stopPropagation()}
                    onBlur={e => updateRoleName(role.id, e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter") updateRoleName(role.id, e.target.value); }}
                    style={{
                      background: "rgba(15, 23, 42, 0.8)", border: `1px solid ${role.color}`,
                      borderRadius: 6, padding: "4px 8px", color: "#E2E8F0",
                      fontSize: 13, fontFamily: "inherit", outline: "none", width: "100%",
                    }}
                  />
                ) : (
                  <div
                    style={{ fontSize: 13, color: role.name ? "#94A3B8" : "#475569", fontStyle: role.name ? "normal" : "italic", cursor: "text" }}
                    onClick={e => { e.stopPropagation(); setEditingRole(role.id); }}
                  >
                    {role.name || "Click to assign name"}
                  </div>
                )}
              </div>
              <span style={{
                fontSize: 10, fontFamily: "'Space Mono', monospace",
                padding: "3px 8px", borderRadius: 6,
                background: `${role.color}18`, color: role.color,
              }}>
                {role.department}
              </span>
            </div>
            <div style={{ fontSize: 12, color: "#64748B", marginBottom: 8 }}>
              {role.responsibilities.length} responsibilities · {roleProcesses.length} processes
            </div>
            <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
              {roleProcesses.slice(0, 3).map(p => (
                <span key={p.id} style={{
                  fontSize: 10, padding: "2px 8px", borderRadius: 5,
                  background: "rgba(148, 163, 184, 0.08)", color: "#94A3B8",
                }}>
                  {p.name.length > 25 ? p.name.slice(0, 25) + "…" : p.name}
                </span>
              ))}
              {roleProcesses.length > 3 && (
                <span style={{ fontSize: 10, padding: "2px 8px", color: "#64748B" }}>
                  +{roleProcesses.length - 3} more
                </span>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── Role Detail ─────────────────────────────────────
function RoleDetail({ role, roles, processes, onBack, onSelectProcess, editingRole, setEditingRole, updateRoleName }) {
  const roleProcesses = processes.filter(p => p.participants.includes(role.id));
  const collaborators = new Set();
  roleProcesses.forEach(p => p.participants.forEach(pid => { if (pid !== role.id) collaborators.add(pid); }));

  return (
    <div>
      <button onClick={onBack} style={{
        background: "none", border: "none", color: "#F59E0B", cursor: "pointer",
        fontSize: 13, fontFamily: "inherit", marginBottom: 16, padding: 0,
      }}>
        ← Back to Team
      </button>

      <div style={{
        background: "rgba(30, 41, 59, 0.6)",
        border: "1px solid rgba(148, 163, 184, 0.08)",
        borderRadius: 14, padding: 28, marginBottom: 24,
        borderTop: `4px solid ${role.color}`,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 16 }}>
          <div>
            <h2 style={{ margin: "0 0 8px", fontSize: 24, fontWeight: 700, color: "#F8FAFC" }}>{role.title}</h2>
            {editingRole === role.id ? (
              <input
                autoFocus
                defaultValue={role.name}
                onBlur={e => updateRoleName(role.id, e.target.value)}
                onKeyDown={e => { if (e.key === "Enter") updateRoleName(role.id, e.target.value); }}
                style={{
                  background: "rgba(15, 23, 42, 0.8)", border: `1px solid ${role.color}`,
                  borderRadius: 8, padding: "6px 12px", color: "#E2E8F0",
                  fontSize: 15, fontFamily: "inherit", outline: "none", width: 250,
                }}
              />
            ) : (
              <div
                style={{
                  fontSize: 15, color: role.name ? "#94A3B8" : "#475569",
                  fontStyle: role.name ? "normal" : "italic", cursor: "pointer",
                  padding: "4px 0",
                }}
                onClick={() => setEditingRole(role.id)}
              >
                {role.name || "Click to assign employee name"} ✎
              </div>
            )}
          </div>
          <span style={{
            fontSize: 12, fontFamily: "'Space Mono', monospace",
            padding: "6px 14px", borderRadius: 8,
            background: `${role.color}18`, color: role.color,
          }}>
            {role.department}
          </span>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }}>
        {/* Responsibilities */}
        <div style={{
          background: "rgba(30, 41, 59, 0.6)",
          border: "1px solid rgba(148, 163, 184, 0.08)",
          borderRadius: 14, padding: 24,
          gridColumn: window.innerWidth < 800 ? "1 / -1" : undefined,
        }}>
          <h3 style={{ margin: "0 0 16px", fontSize: 16, fontWeight: 600, color: "#F8FAFC" }}>
            Responsibilities ({role.responsibilities.length})
          </h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {role.responsibilities.map((resp, i) => (
              <div key={i} style={{
                display: "flex", gap: 10, alignItems: "flex-start",
                padding: "8px 12px",
                background: "rgba(15, 23, 42, 0.4)",
                borderRadius: 8,
                borderLeft: `2px solid ${role.color}33`,
              }}>
                <span style={{ fontSize: 11, color: `${role.color}88`, fontFamily: "'Space Mono', monospace", flexShrink: 0, marginTop: 1 }}>
                  {String(i + 1).padStart(2, "0")}
                </span>
                <span style={{ fontSize: 13, color: "#CBD5E1", lineHeight: 1.5 }}>{resp}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Processes + Collaborators */}
        <div style={{ display: "flex", flexDirection: "column", gap: 24, gridColumn: window.innerWidth < 800 ? "1 / -1" : undefined }}>
          <div style={{
            background: "rgba(30, 41, 59, 0.6)",
            border: "1px solid rgba(148, 163, 184, 0.08)",
            borderRadius: 14, padding: 24,
          }}>
            <h3 style={{ margin: "0 0 16px", fontSize: 16, fontWeight: 600, color: "#F8FAFC" }}>
              Involved in Processes ({roleProcesses.length})
            </h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {roleProcesses.map(p => (
                <button
                  key={p.id}
                  onClick={() => onSelectProcess(p)}
                  style={{
                    textAlign: "left", padding: "10px 14px",
                    background: "rgba(15, 23, 42, 0.4)",
                    border: "1px solid rgba(148, 163, 184, 0.06)",
                    borderRadius: 8, cursor: "pointer",
                    color: "#CBD5E1", fontFamily: "inherit",
                    transition: "all 0.15s",
                  }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = "#F59E0B33"; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = "rgba(148, 163, 184, 0.06)"; }}
                >
                  <div style={{ fontSize: 13, fontWeight: 500 }}>{p.name}</div>
                  <div style={{ fontSize: 11, color: "#64748B", marginTop: 3 }}>{p.category} · {p.steps.length} steps</div>
                </button>
              ))}
            </div>
          </div>

          <div style={{
            background: "rgba(30, 41, 59, 0.6)",
            border: "1px solid rgba(148, 163, 184, 0.08)",
            borderRadius: 14, padding: 24,
          }}>
            <h3 style={{ margin: "0 0 16px", fontSize: 16, fontWeight: 600, color: "#F8FAFC" }}>
              Works With ({collaborators.size})
            </h3>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {[...collaborators].map(cid => {
                const collab = roles.find(r => r.id === cid);
                if (!collab) return null;
                return (
                  <span key={cid} style={{
                    fontSize: 12, padding: "5px 12px", borderRadius: 8,
                    background: `${collab.color}12`,
                    color: collab.color,
                    border: `1px solid ${collab.color}22`,
                  }}>
                    {collab.title.split("(")[0].split("-")[0].trim()}
                  </span>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Process Grid ────────────────────────────────────
function ProcessGrid({ processes, roles, onSelect }) {
  const catColors = {
    Preconstruction: "#F59E0B",
    Construction: "#10B981",
    "Change Management": "#8B5CF6",
    Financial: "#3B82F6",
    Operations: "#EC4899",
  };

  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(350px, 1fr))", gap: 16 }}>
      {processes.map(p => {
        const color = catColors[p.category] || "#94A3B8";
        const owner = roles.find(r => r.id === p.owner);
        return (
          <div
            key={p.id}
            onClick={() => onSelect(p)}
            style={{
              background: "rgba(30, 41, 59, 0.6)",
              border: "1px solid rgba(148, 163, 184, 0.08)",
              borderRadius: 14, padding: 20,
              borderLeft: `3px solid ${color}`,
              cursor: "pointer",
              transition: "all 0.2s",
            }}
            onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.borderColor = `${color}33`; }}
            onMouseLeave={e => { e.currentTarget.style.transform = "none"; e.currentTarget.style.borderColor = "rgba(148, 163, 184, 0.08)"; }}
          >
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
              <span style={{
                fontSize: 10, fontFamily: "'Space Mono', monospace",
                padding: "3px 8px", borderRadius: 6,
                background: `${color}18`, color,
                textTransform: "uppercase", letterSpacing: "0.05em",
              }}>
                {p.category}
              </span>
              <span style={{ fontSize: 11, color: "#64748B", fontFamily: "'Space Mono', monospace" }}>{p.steps.length} steps</span>
            </div>
            <h3 style={{ margin: "0 0 8px", fontSize: 15, fontWeight: 600, color: "#F8FAFC" }}>{p.name}</h3>
            <p style={{ margin: "0 0 12px", fontSize: 12, color: "#94A3B8", lineHeight: 1.5 }}>
              {p.description.length > 120 ? p.description.slice(0, 120) + "…" : p.description}
            </p>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ fontSize: 11, color: "#64748B" }}>
                Owner: <span style={{ color: owner?.color || "#94A3B8" }}>{assignmentLabel(p)}</span>
              </div>
              <div style={{ display: "flex", gap: -6 }}>
                {p.participants.slice(0, 5).map(pid => {
                  const r = roles.find(x => x.id === pid);
                  return r ? (
                    <div key={pid} style={{
                      width: 24, height: 24, borderRadius: "50%",
                      background: r.color, border: "2px solid #1E293B",
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 9, fontWeight: 700, color: "#fff",
                      marginLeft: -4,
                    }}>
                      {(r.title || "").split(" ").map(w => w[0]).join("").slice(0, 2)}
                    </div>
                  ) : null;
                })}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── Process Detail ──────────────────────────────────
function ProcessDetail({ process, roles, onBack, onSelectRole, showROCC, showNA }) {
  const [viewMode, setViewMode] = useState("flowchart");
  const displaySteps = (showROCC ? process.steps : process.steps.filter(s => !s.startsWith("[ROCC]"))).filter(s => showNA || !s.startsWith("[N/A]"));
  const catColors = {
    Preconstruction: "#F59E0B", Construction: "#10B981",
    "Change Management": "#8B5CF6", Financial: "#3B82F6",
    Operations: "#EC4899", Sales: "#F472B6",
    Design: "#A855F7", "HR / Admin": "#FB923C",
  };
  const color = catColors[process.category] || "#94A3B8";
  const owner = roles.find(r => r.id === process.owner);

  const detectRole = (step) => {
    const s = step.toLowerCase();
    const roleKeywords = [
      { id: "president", keywords: ["president", "jim signs", "jim "] },
      { id: "doc", keywords: ["doc ", "doc.", "director of construction", "doc reviews", "doc logs", "doc enters", "doc assigns", "doc orders", "doc receives", "doc fills", "doc meets", "doc submits", "doc notifies", "doc forwards", "doc prints", "doc prepares", "doc modifies", "doc clicks", "doc and/or", "doc places", "doc makes", "doc updates", "doc calculates"] },
      { id: "dop", keywords: ["dop ", "dop.", "director of purchasing", "director of operations", "dop enters", "dop orders", "dop receives", "dop sends", "dop makes", "dop logs", "dop gives", "dop requests", "dop numbers", "dop informs", "dop calls", "dop verifies", "dop delivers", "dop follows", "dop saves", "dop puts", "dop resends", "dop contacts", "dop coordinates"] },
      { id: "cfo", keywords: ["cfo ", "cfo.", "cfo prepares", "cfo updates", "cfo processes"] },
      { id: "superintendent", keywords: ["superintendent", "super ", "super.", "super contacts", "super copies", "super conducts", "super retrieves", "super transfers", "super returns", "super reviews", "super notifies", "super waits", "super proceeds", "super schedules", "super negotiates", "super fills", "super clicks", "super initials", "super gives"] },
      { id: "dir_sales", keywords: ["dir of sales", "director of sales", "dir. of sales", "dos "] },
      { id: "sales_exec", keywords: ["sales exec", "sales executive", "your sales executive"] },
      { id: "purchasing_mgr", keywords: ["purchasing manager", "purchasing determines", "purchasing collects", "purchasing enters", "purchasing receives"] },
      { id: "project_mgr", keywords: ["project manager", "pm ", "pm.", "pm or doc", "pm types"] },
      { id: "acct_asst", keywords: ["acct asst", "acct.", "accounting asst", "accounting assistant", "accounting updates"] },
      { id: "construction", keywords: ["construction", "construction lead", "field"] },
      { id: "admin_asst", keywords: ["admin asst", "admin assistant"] },
      { id: "controller", keywords: ["controller"] },
      { id: "interior_designer", keywords: ["interior designer", "designer calls", "designer makes", "designer delivers", "designer receives", "designer selects", "designer continues", "designer puts", "designer will", "designer initials"] },
      { id: "selection_coordinator", keywords: ["selection coordinator"] },
      { id: "customer_care", keywords: ["customer care"] }
    ];
    for (const rk of roleKeywords) {
      for (const kw of rk.keywords) {
        if (s.includes(kw)) return roles.find(r => r.id === rk.id);
      }
    }
    return null;
  };

  return (
    <div>
      <button onClick={onBack} style={{
        background: "none", border: "none", color: "#F59E0B", cursor: "pointer",
        fontSize: 13, fontFamily: "inherit", marginBottom: 16, padding: 0,
      }}>
        ← Back to SOPs
      </button>

      <div style={{
        background: "rgba(30, 41, 59, 0.6)",
        border: "1px solid rgba(148, 163, 184, 0.08)",
        borderRadius: 14, padding: 28, marginBottom: 24,
        borderTop: `4px solid ${color}`,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
          <div>
            <span style={{
              fontSize: 11, fontFamily: "'Space Mono', monospace",
              padding: "4px 10px", borderRadius: 6,
              background: `${color}18`, color,
              textTransform: "uppercase", letterSpacing: "0.05em",
            }}>
              {process.category}
            </span>
            <h2 style={{ margin: "12px 0 8px", fontSize: 24, fontWeight: 700, color: "#F8FAFC" }}>{process.name}</h2>
            <p style={{ margin: "0 0 16px", fontSize: 14, color: "#94A3B8", lineHeight: 1.6 }}>{process.description}</p>
            <div style={{ display: "flex", gap: 24, flexWrap: "wrap", fontSize: 13, color: "#64748B" }}>
              <span>Owner: <span style={{ color: owner?.color }}>{assignmentLabel(process)}</span></span>
              {process.date && <span>Date: {process.date}</span>}
              <span>{displaySteps.length} steps</span>
            </div>
          </div>
          <div style={{
            display: "flex", gap: 2, background: "rgba(15, 23, 42, 0.6)", borderRadius: 8, padding: 3,
            border: "1px solid rgba(148, 163, 184, 0.1)",
          }}>
            <button onClick={() => setViewMode("flowchart")} style={{
              padding: "6px 14px", border: "none", borderRadius: 6, cursor: "pointer",
              fontSize: 12, fontFamily: "inherit", fontWeight: 600,
              background: viewMode === "flowchart" ? `${color}25` : "transparent",
              color: viewMode === "flowchart" ? color : "#64748B",
            }}>
              ◈ Flowchart
            </button>
            <button onClick={() => setViewMode("list")} style={{
              padding: "6px 14px", border: "none", borderRadius: 6, cursor: "pointer",
              fontSize: 12, fontFamily: "inherit", fontWeight: 600,
              background: viewMode === "list" ? `${color}25` : "transparent",
              color: viewMode === "list" ? color : "#64748B",
            }}>
              ☰ List
            </button>
          </div>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: viewMode === "flowchart" ? "1fr 260px" : "2fr 1fr", gap: 24 }}>
        {viewMode === "list" && (
          <div style={{
            background: "rgba(30, 41, 59, 0.6)",
            border: "1px solid rgba(148, 163, 184, 0.08)",
            borderRadius: 14, padding: 24,
          }}>
            <h3 style={{ margin: "0 0 16px", fontSize: 16, fontWeight: 600, color: "#F8FAFC" }}>Process Steps</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {displaySteps.map((step, i) => {
                const isDecision = step.toLowerCase().startsWith("if ") || step.includes("?");
                return (
                  <div key={i} style={{
                    display: "flex", gap: 12, alignItems: "flex-start", padding: "10px 14px",
                    background: isDecision ? "rgba(245, 158, 11, 0.05)" : "rgba(15, 23, 42, 0.4)",
                    borderRadius: 8, borderLeft: `2px solid ${isDecision ? "#F59E0B" : color}33`,
                  }}>
                    <span style={{ fontSize: 11, color: isDecision ? "#F59E0B" : `${color}88`, fontFamily: "'Space Mono', monospace", flexShrink: 0, marginTop: 1, minWidth: 20 }}>
                      {isDecision ? "◆" : String(i + 1).padStart(2, "0")}
                    </span>
                    <span style={{ fontSize: 13, color: isDecision ? "#FCD34D" : "#CBD5E1", lineHeight: 1.5 }}>{step}</span>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {viewMode === "flowchart" && (
          <div style={{
            background: "rgba(30, 41, 59, 0.6)",
            border: "1px solid rgba(148, 163, 184, 0.08)",
            borderRadius: 14, padding: 32, overflowX: "auto",
          }}>
            <h3 style={{ margin: "0 0 20px", fontSize: 16, fontWeight: 600, color: "#F8FAFC" }}>Process Flowchart</h3>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 0, minWidth: 360 }}>
              {displaySteps.map((step, i) => {
                const isDecision = step.includes("?") && !step.toLowerCase().startsWith("if ");
                const isBranch = step.toLowerCase().startsWith("if ");
                const isSubprocess = (step.includes("Process") || step.includes("process")) && (step.includes("begins") || step.includes("continues") || step.includes("Follows") || step.includes("Proceeds"));
                const detectedRole = detectRole(step);
                const roleColor = detectedRole?.color || "#64748B";
                const roleName = detectedRole ? detectedRole.title.split("(")[0].split("-")[0].trim() : "";

                const connector = i > 0 ? (
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                    <div style={{ width: 2, height: 14, background: isBranch ? "#F59E0B44" : "rgba(148, 163, 184, 0.2)" }} />
                    <div style={{ width: 0, height: 0, borderLeft: "5px solid transparent", borderRight: "5px solid transparent", borderTop: `5px solid ${isBranch ? "#F59E0B66" : "rgba(148, 163, 184, 0.3)"}` }} />
                  </div>
                ) : null;

                if (isDecision) {
                  return (
                    <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                      {connector}
                      <div style={{
                        width: 200, height: 100,
                        background: "rgba(245, 158, 11, 0.12)",
                        border: "2px solid #F59E0B55",
                        clipPath: "polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)",
                        display: "flex", alignItems: "center", justifyContent: "center",
                        padding: "24px 30px", textAlign: "center",
                      }}>
                        <span style={{ fontSize: 10, color: "#FCD34D", lineHeight: 1.3, fontWeight: 600 }}>
                          {step.length > 50 ? step.slice(0, 50) + "…" : step}
                        </span>
                      </div>
                      <div style={{ display: "flex", gap: 80, marginTop: 2 }}>
                        <span style={{ fontSize: 9, color: "#10B981", fontFamily: "'Space Mono', monospace", fontWeight: 700 }}>YES</span>
                        <span style={{ fontSize: 9, color: "#EF4444", fontFamily: "'Space Mono', monospace", fontWeight: 700 }}>NO</span>
                      </div>
                    </div>
                  );
                }

                if (isBranch) {
                  const isYes = step.toLowerCase().startsWith("if yes");
                  const isNo = step.toLowerCase().startsWith("if no");
                  const branchColor = isYes ? "#10B981" : isNo ? "#EF4444" : "#F59E0B";
                  return (
                    <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                      {connector}
                      <div style={{
                        maxWidth: 360, padding: "8px 14px",
                        background: `${branchColor}0A`,
                        border: `1.5px solid ${branchColor}33`,
                        borderRadius: 8,
                        borderLeft: `4px solid ${branchColor}`,
                        textAlign: "center",
                      }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6, justifyContent: "center" }}>
                          <span style={{
                            fontSize: 9, fontFamily: "'Space Mono', monospace", fontWeight: 700,
                            padding: "2px 5px", borderRadius: 3,
                            background: `${branchColor}22`, color: branchColor,
                          }}>
                            {isYes ? "YES" : isNo ? "NO" : "IF"}
                          </span>
                          <span style={{ fontSize: 11, color: "#CBD5E1", lineHeight: 1.4 }}>
                            {step.replace(/^if (yes|no):?\s*/i, "")}
                          </span>
                        </div>
                      </div>
                    </div>
                  );
                }

                if (isSubprocess) {
                  return (
                    <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                      {connector}
                      <div style={{
                        maxWidth: 320, padding: "8px 14px",
                        background: "rgba(139, 92, 246, 0.08)",
                        border: "2px dashed #8B5CF644",
                        borderRadius: 8, textAlign: "center",
                      }}>
                        <span style={{ fontSize: 11, color: "#A78BFA", lineHeight: 1.4 }}>{step}</span>
                      </div>
                    </div>
                  );
                }

                return (
                  <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                    {connector}
                    <div style={{
                      maxWidth: 370, width: "100%", padding: "10px 14px",
                      background: `${roleColor}10`,
                      border: `1.5px solid ${roleColor}33`,
                      borderRadius: 8, textAlign: "center", position: "relative",
                    }}>
                      {roleName && (
                        <div style={{
                          position: "absolute", top: -8, left: 10,
                          fontSize: 8, fontFamily: "'Space Mono', monospace", fontWeight: 700,
                          padding: "1px 5px", borderRadius: 3,
                          background: roleColor, color: "#fff",
                          textTransform: "uppercase", letterSpacing: "0.04em",
                        }}>
                          {roleName.length > 22 ? roleName.slice(0, 22) + "…" : roleName}
                        </div>
                      )}
                      <span style={{ fontSize: 11, color: "#E2E8F0", lineHeight: 1.5, display: "block", marginTop: roleName ? 4 : 0 }}>
                        {step}
                      </span>
                    </div>
                  </div>
                );
              })}

              <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                <div style={{ width: 2, height: 14, background: "rgba(148, 163, 184, 0.2)" }} />
                <div style={{
                  width: 40, height: 40, borderRadius: "50%",
                  background: "rgba(16, 185, 129, 0.12)", border: "2px solid #10B98144",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontSize: 10, color: "#10B981", fontWeight: 700, fontFamily: "'Space Mono', monospace",
                }}>
                  END
                </div>
              </div>
            </div>
          </div>
        )}

        <div style={{
          background: "rgba(30, 41, 59, 0.6)",
          border: "1px solid rgba(148, 163, 184, 0.08)",
          borderRadius: 14, padding: 24, alignSelf: "start",
        }}>
          {viewMode === "flowchart" && (
            <div style={{ marginBottom: 20 }}>
              <h3 style={{ margin: "0 0 12px", fontSize: 14, fontWeight: 600, color: "#F8FAFC" }}>Color Legend</h3>
              <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                {process.participants.map(pid => {
                  const r = roles.find(x => x.id === pid);
                  if (!r) return null;
                  return (
                    <div key={pid} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 3, background: r.color, flexShrink: 0 }} />
                      <span style={{ fontSize: 11, color: "#CBD5E1" }}>{r.title.split("(")[0].trim()}</span>
                    </div>
                  );
                })}
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4 }}>
                  <div style={{ width: 12, height: 12, background: "#F59E0B", flexShrink: 0, clipPath: "polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)" }} />
                  <span style={{ fontSize: 11, color: "#FCD34D" }}>Decision Point</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <div style={{ width: 12, height: 12, borderRadius: 3, border: "1.5px dashed #8B5CF6", flexShrink: 0 }} />
                  <span style={{ fontSize: 11, color: "#A78BFA" }}>Sub-process</span>
                </div>
              </div>
              <div style={{ height: 1, background: "rgba(148, 163, 184, 0.1)", margin: "12px 0" }} />
            </div>
          )}

          <h3 style={{ margin: "0 0 16px", fontSize: 16, fontWeight: 600, color: "#F8FAFC" }}>
            Participants ({process.participants.length})
          </h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {process.participants.map(pid => {
              const r = roles.find(x => x.id === pid);
              if (!r) return null;

        (r.includes("incoming check") || r.includes("deposit slip") || r.includes("deposit receipt") || r.includes("book deposit")) && p.id === "accounting_weekly" ||
        (r.includes("shutoff notice") || r.includes("past due on water")) && p.id === "accounting_weekly" ||
        (r.includes("checks to print") || r.includes("suggested checks") || r.includes("friday")) && r.includes("submit") && p.id === "accounting_weekly" ||
        (r.includes("builders risk")) && p.id === "accounting_monthly" ||
        (r.includes("water bill") || r.includes("late fee") || r.includes("past due") && r.includes("oa")) && p.id === "accounting_monthly" ||
        (r.includes("cash report")) && p.id === "accounting_monthly" ||
        (r.includes("bank reconcil")) && p.id === "accounting_monthly" ||
        (r.includes("mvid") || r.includes("sales and use tax")) && p.id === "accounting_monthly" ||
        (r.includes("reserve money") || r.includes("prosperity")) && p.id === "accounting_monthly" ||
        (r.includes("banyan tree") || r.includes("bbj")) && p.id === "accounting_monthly" ||
        (r.includes("title comp") && r.includes("invoice")) && p.id === "accounting_monthly" ||
        (r.includes("% of completion") || r.includes("completion report")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("intercompan")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("payroll report") || r.includes("texas mutual") || r.includes("workforce commission")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("gl audit")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("annual assessment") || r.includes("hoa budget")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("cbusa")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("property tax") && r.includes("spreadsheet")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("cpa") && r.includes("tax")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("1099")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("medical") || r.includes("dental") || r.includes("vision") || r.includes("insurance management")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("401k") || r.includes("401 k")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("new wire") && r.includes("bank")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("intercompany bank transfer")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("loan tracking") || r.includes("debt schedule")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("settlement statement")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("w9") || r.includes("new vendor")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("new resident") && r.includes("qb")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("hoa attorney")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("new companies") && r.includes("cpa")) && p.id === "accounting_quarterly_yearly" ||
        (r.includes("not importing") || r.includes("sonny")) && p.id === "accounting_quarterly_yearly";
      if (cm && !matched.find(m => m.id === p.id)) matched.push(p);
    });
    return matched;
  };

  const catColors = {

              <button key={p.id} onClick={() => setActiveFilter(activeFilter === p.id ? null : p.id)} style={{

          </h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

                        <React.Fragment>

                      {linkedProcesses.length > 0 && (
                        <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginTop: 6 }}>

        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>

            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {memberProcesses.map(p => {

                const respCount = member.responsibilities.filter(resp => mapRespToProcesses(resp).some(mp => mp.id === p.id)).length;
                return (
                  <button key={p.id} onClick={() => onSelectProcess(p)} style={{
                    textAlign: "left", padding: "12px 14px",
                    background: activeFilter === p.id ? `${pColor}0A` : "rgba(15, 23, 42, 0.4)",
                    border: `1px solid ${activeFilter === p.id ? pColor + "33" : "rgba(148, 163, 184, 0.06)"}`,
                    borderRadius: 8, cursor: "pointer", color: "#CBD5E1", fontFamily: "inherit",
                    borderLeft: `3px solid ${pColor}`,
                  }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                      <div>

                      {respCount > 0 && (
                        <span onClick={e => { e.stopPropagation(); setActiveFilter(activeFilter === p.id ? null : p.id); }} style={{

          <div style={{ background: "rgba(30, 41, 59, 0.6)", border: "1px solid rgba(148, 163, 184, 0.08)", borderRadius: 14, padding: 24 }}>

              <div key={idx} style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                <VertLine height={20} />
                <Card member={item.member} subtitle={item.subtitle} vacant={item.vacant} />
              </div>
            );
          })}
        </div>
      </div>

      <div style={{
        marginTop: 32, padding: "16px 20px",
        background: "rgba(15, 23, 42, 0.5)",
        borderRadius: 10, border: "1px solid rgba(148, 163, 184, 0.06)",
        display: "flex", justifyContent: "space-around", flexWrap: "wrap", gap: 16,
      }}>
        {team.map(function(m) {
          return (
            <div key={m.id} style={{ textAlign: "center", minWidth: 80 }}>
              <div style={{ fontSize: 20, fontWeight: 700, color: m.color || "#64748B", fontFamily: "'Space Mono', monospace" }}>
                {(m.responsibilities || []).length}
              </div>
              <div style={{ fontSize: 10, color: "#94A3B8", marginTop: 2 }}>
                {m.name || m.title}
              </div>
              <div style={{
                marginTop: 4, height: 4, borderRadius: 2,
                background: (m.color || "#64748B") + "22", overflow: "hidden",
              }}>
                <div style={{
                  height: "100%", borderRadius: 2,
                  background: m.color || "#64748B",
                  width: ((m.responsibilities || []).length / Math.max.apply(null, team.map(function(t) { return (t.responsibilities || []).length; })) * 100) + "%",
                }} />
              </div>
            </div>
          );
        })}
      </div>
    
        {/* ═══ ROLES COVERED MODAL ═══ */}
        {showRolesCovered && (
          <div style={{
            position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
            background: "rgba(0,0,0,0.7)", zIndex: 1000,
            display: "flex", alignItems: "center", justifyContent: "center",
            padding: 20,
          }} onClick={() => setShowRolesCovered(false)}>
            <div style={{
              background: "#1E293B", borderRadius: 16, padding: 32,
              maxWidth: 700, width: "100%", maxHeight: "80vh", overflowY: "auto",
              border: "1px solid rgba(148, 163, 184, 0.15)",
            }} onClick={e => e.stopPropagation()}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
                <h2 style={{ margin: 0, fontSize: 20, fontWeight: 700, color: "#F8FAFC" }}>
                  Original Roles Covered by Current Team
                </h2>
                <button onClick={() => setShowRolesCovered(false)} style={{
                  background: "none", border: "none", color: "#94A3B8", fontSize: 20, cursor: "pointer",
                }}>x</button>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                {currentTeam.map(member => (
                  <div key={member.id} style={{
                    background: "rgba(15, 23, 42, 0.5)", borderRadius: 10, padding: 16,
                    borderLeft: "3px solid " + member.color,
                  }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                      <div style={{
                        width: 32, height: 32, borderRadius: 8,
                        background: member.color + "20", border: "2px solid " + member.color,
                        display: "flex", alignItems: "center", justifyContent: "center",
                        fontSize: 12, fontWeight: 700, color: member.color,
                      }}>
                        {(member.name || member.title).split(" ").map(function(w) { return w[0]; }).join("").slice(0, 2)}
                      </div>
                      <div>
                        <div style={{ fontSize: 14, fontWeight: 600, color: "#F8FAFC" }}>{member.name}</div>
                        <div style={{ fontSize: 11, color: "#64748B" }}>{member.title}</div>
                      </div>
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                      {member.absorbs.map(function(roleId) {
                        var role = roles.find(function(r) { return r.id === roleId; });
                        return React.createElement("span", {
                          key: roleId,
                          style: {
                            padding: "3px 10px", borderRadius: 6, fontSize: 11, fontWeight: 500,
                            background: "rgba(59, 130, 246, 0.15)", color: "#60A5FA",
                            border: "1px solid rgba(59, 130, 246, 0.2)",
                          }
                        }, role ? role.title : roleId);
                      })}
                    </div>
                  </div>
                ))}
              </div>
              <div style={{ marginTop: 20, padding: "12px 16px", background: "rgba(15, 23, 42, 0.5)", borderRadius: 10, fontSize: 12, color: "#94A3B8" }}>
                {currentTeam.length} employees covering {currentTeam.reduce(function(a, m) { return a + m.absorbs.length; }, 0)} original roles from the full {roles.length}-position org chart
              </div>
            </div>
          </div>
        )}

      </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(MCHOpsHub));
  </script>
</body>
</html>
