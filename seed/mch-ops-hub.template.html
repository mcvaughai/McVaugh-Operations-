// ─── Process Detail ──────────────────────────────────
function ProcessDetail({ process, roles, onBack, onSelectRole, showROCC, showNA }) {
  const [viewMode, setViewMode] = useState("flowchart");
  const displaySteps = (showROCC ? process.steps : process.steps.filter(s => !s.startsWith("[ROCC]"))).filter(s => showNA || !s.startsWith("[N/A]"));
  const catColors = {
    Preconstruction: "#F59E0B", Construction: "#10B981",
    "Change Management": "#8B5CF6", Financial: "#3B82F6",
    Operations: "#EC4899", Sales: "#F472B6",
    Design: "#A855F7", "HR / Admin": "#FB923C",
  };
  const color = catColors[process.category] || "#94A3B8";
  const owner = roles.find(r => r.id === process.owner);

  const detectRole = (step) => {
    const s = step.toLowerCase();
    const roleKeywords = [
      { id: "president", keywords: ["president", "jim signs", "jim "] },
      { id: "doc", keywords: ["doc ", "doc.", "director of construction", "doc reviews", "doc logs", "doc enters", "doc assigns", "doc orders", "doc receives", "doc fills", "doc meets", "doc submits", "doc notifies", "doc forwards", "doc prints", "doc prepares", "doc modifies", "doc clicks", "doc and/or", "doc places", "doc makes", "doc updates", "doc calculates"] },
      { id: "dop", keywords: ["dop ", "dop.", "director of purchasing", "director of operations", "dop enters", "dop orders", "dop receives", "dop sends", "dop makes", "dop logs", "dop gives", "dop requests", "dop numbers", "dop informs", "dop calls", "dop verifies", "dop delivers", "dop follows", "dop saves", "dop puts", "dop resends", "dop contacts", "dop coordinates"] },
      { id: "cfo", keywords: ["cfo ", "cfo.", "cfo prepares", "cfo updates", "cfo processes"] },
      { id: "superintendent", keywords: ["superintendent", "super ", "super.", "super contacts", "super copies", "super conducts", "super retrieves", "super transfers", "super returns", "super reviews", "super notifies", "super waits", "super proceeds", "super schedules", "super negotiates", "super fills", "super clicks", "super initials", "super gives"] },
      { id: "dir_sales", keywords: ["dir of sales", "director of sales", "dir. of sales", "dos "] },
      { id: "sales_exec", keywords: ["sales exec", "sales executive", "your sales executive"] },
      { id: "purchasing_mgr", keywords: ["purchasing manager", "purchasing determines", "purchasing collects", "purchasing enters", "purchasing receives"] },
      { id: "project_mgr", keywords: ["project manager", "pm ", "pm.", "pm or doc", "pm types"] },
      { id: "acct_asst", keywords: ["acct asst", "acct.", "accounting asst", "accounting assistant", "accounting updates"] },
      { id: "construction_asst", keywords: ["ca ", "ca.", "construction asst", "construction assistant"] },
      { id: "admin_asst", keywords: ["admin asst", "admin assistant"] },
      { id: "controller", keywords: ["controller"] },
      { id: "interior_designer", keywords: ["interior designer", "designer calls", "designer makes", "designer delivers", "designer receives", "designer selects", "designer continues", "designer puts", "designer will", "designer initials"] },
      { id: "selection_coordinator", keywords: ["selection coordinator"] },
      { id: "customer_care", keywords: ["customer care"] }
    ];
    for (const rk of roleKeywords) {
      for (const kw of rk.keywords) {
        if (s.includes(kw)) return roles.find(r => r.id === rk.id);
      }
    }
    return null;
  };

  return (
    <div>
      <button onClick={onBack} style={{
        background: "none", border: "none", color: "#F59E0B", cursor: "pointer",
        fontSize: 13, fontFamily: "inherit", marginBottom: 16, padding: 0,
      }}>
        ← Back to SOPs
      </button>

      <div style={{
        background: "rgba(30, 41, 59, 0.6)",
        border: "1px solid rgba(148, 163, 184, 0.08)",
        borderRadius: 14, padding: 28, marginBottom: 24,
        borderTop: `4px solid ${color}`,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
          <div>
            <span style={{
              fontSize: 11, fontFamily: "'Space Mono', monospace",
              padding: "4px 10px", borderRadius: 6,
              background: `${color}18`, color,
              textTransform: "uppercase", letterSpacing: "0.05em",
            }}>
              {process.category}
            </span>
            <h2 style={{ margin: "12px 0 8px", fontSize: 24, fontWeight: 700, color: "#F8FAFC" }}>{process.name}</h2>
            <p style={{ margin: "0 0 16px", fontSize: 14, color: "#94A3B8", lineHeight: 1.6 }}>{process.description}</p>
            <div style={{ display: "flex", gap: 24, flexWrap: "wrap", fontSize: 13, color: "#64748B" }}>
              <span>Owner: <span style={{ color: owner?.color }}>{owner?.title || "—"}</span></span>
              {process.date && <span>Date: {process.date}</span>}
              <span>{displaySteps.length} steps</span>
            </div>
          </div>
          <div style={{
            display: "flex", gap: 2, background: "rgba(15, 23, 42, 0.6)", borderRadius: 8, padding: 3,
            border: "1px solid rgba(148, 163, 184, 0.1)",
          }}>
            <button onClick={() => setViewMode("flowchart")} style={{
              padding: "6px 14px", border: "none", borderRadius: 6, cursor: "pointer",
              fontSize: 12, fontFamily: "inherit", fontWeight: 600,
              background: viewMode === "flowchart" ? `${color}25` : "transparent",
              color: viewMode === "flowchart" ? color : "#64748B",
            }}>
              ◈ Flowchart
            </button>
            <button onClick={() => setViewMode("list")} style={{
              padding: "6px 14px", border: "none", borderRadius: 6, cursor: "pointer",
              fontSize: 12, fontFamily: "inherit", fontWeight: 600,
              background: viewMode === "list" ? `${color}25` : "transparent",
              color: viewMode === "list" ? color : "#64748B",
            }}>
              ☰ List
            </button>
          </div>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: viewMode === "flowchart" ? "1fr 260px" : "2fr 1fr", gap: 24 }}>
        {viewMode === "list" && (
          <div style={{
            background: "rgba(30, 41, 59, 0.6)",
            border: "1px solid rgba(148, 163, 184, 0.08)",
            borderRadius: 14, padding: 24,
          }}>
            <h3 style={{ margin: "0 0 16px", fontSize: 16, fontWeight: 600, color: "#F8FAFC" }}>Process Steps</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {displaySteps.map((step, i) => {
                const isDecision = step.toLowerCase().startsWith("if ") || step.includes("?");
                return (
                  <div key={i} style={{
                    display: "flex", gap: 12, alignItems: "flex-start", padding: "10px 14px",
                    background: isDecision ? "rgba(245, 158, 11, 0.05)" : "rgba(15, 23, 42, 0.4)",
                    borderRadius: 8, borderLeft: `2px solid ${isDecision ? "#F59E0B" : color}33`,
                  }}>
                    <span style={{ fontSize: 11, color: isDecision ? "#F59E0B" : `${color}88`, fontFamily: "'Space Mono', monospace", flexShrink: 0, marginTop: 1, minWidth: 20 }}>
                      {isDecision ? "◆" : String(i + 1).padStart(2, "0")}
                    </span>
                    <span style={{ fontSize: 13, color: isDecision ? "#FCD34D" : "#CBD5E1", lineHeight: 1.5 }}>{step}</span>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {viewMode === "flowchart" && (
          <div style={{
            background: "rgba(30, 41, 59, 0.6)",
            border: "1px solid rgba(148, 163, 184, 0.08)",
            borderRadius: 14, padding: 32, overflowX: "auto",
          }}>
            <h3 style={{ margin: "0 0 20px", fontSize: 16, fontWeight: 600, color: "#F8FAFC" }}>Process Flowchart</h3>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 0, minWidth: 360 }}>
              {displaySteps.map((step, i) => {
                const isDecision = step.includes("?") && !step.toLowerCase().startsWith("if ");
                const isBranch = step.toLowerCase().startsWith("if ");
                const isSubprocess = (step.includes("Process") || step.includes("process")) && (step.includes("begins") || step.includes("continues") || step.includes("Follows") || step.includes("Proceeds"));
                const detectedRole = detectRole(step);
                const roleColor = detectedRole?.color || "#64748B";
                const roleName = detectedRole ? detectedRole.title.split("(")[0].split("-")[0].trim() : "";

                const connector = i > 0 ? (
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                    <div style={{ width: 2, height: 14, background: isBranch ? "#F59E0B44" : "rgba(148, 163, 184, 0.2)" }} />
                    <div style={{ width: 0, height: 0, borderLeft: "5px solid transparent", borderRight: "5px solid transparent", borderTop: `5px solid ${isBranch ? "#F59E0B66" : "rgba(148, 163, 184, 0.3)"}` }} />
                  </div>
                ) : null;

                if (isDecision) {
                  return (
                    <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                      {connector}
                      <div style={{
                        width: 200, height: 100,
                        background: "rgba(245, 158, 11, 0.12)",
                        border: "2px solid #F59E0B55",
                        clipPath: "polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)",
                        display: "flex", alignItems: "center", justifyContent: "center",
                        padding: "24px 30px", textAlign: "center",
                      }}>
                        <span style={{ fontSize: 10, color: "#FCD34D", lineHeight: 1.3, fontWeight: 600 }}>
                          {step.length > 50 ? step.slice(0, 50) + "…" : step}
                        </span>
                      </div>
                      <div style={{ display: "flex", gap: 80, marginTop: 2 }}>
                        <span style={{ fontSize: 9, color: "#10B981", fontFamily: "'Space Mono', monospace", fontWeight: 700 }}>YES</span>
                        <span style={{ fontSize: 9, color: "#EF4444", fontFamily: "'Space Mono', monospace", fontWeight: 700 }}>NO</span>
                      </div>
                    </div>
                  );
                }

                if (isBranch) {
                  const isYes = step.toLowerCase().startsWith("if yes");
                  const isNo = step.toLowerCase().startsWith("if no");
                  const branchColor = isYes ? "#10B981" : isNo ? "#EF4444" : "#F59E0B";

                    <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>

                      <div style={{
                        maxWidth: 360, padding: "8px 14px",
                        background: `${branchColor}0A`,

                        borderRadius: 8,
                        borderLeft: `4px solid ${branchColor}`,
                        textAlign: "center",
                      }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6, justifyContent: "center" }}>
                          <span style={{
                            fontSize: 9, fontFamily: "'Space Mono', monospace", fontWeight: 700,

                            background: `${branchColor}22`, color: branchColor,

                            {isYes ? "YES" : isNo ? "NO" : "IF"}
                          </span>
                          <span style={{ fontSize: 11, color: "#CBD5E1", lineHeight: 1.4 }}>
                            {step.replace(/^if (yes|no):?\s*/i, "")}

                        </div>
                      </div>
                    </div>
                  );
                }

                if (isSubprocess) {
                  return (
                    <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                      {connector}
                      <div style={{
                        maxWidth: 320, padding: "8px 14px",

                    </div>
                  );

                return (

                    {connector}
                    <div style={{
                      maxWidth: 370, width: "100%", padding: "10px 14px",

                        {step}
                      </span>
                    </div>
                  </div>

              <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>

function CurrentMemberDetail({ member, team, roles, processes, onBack, onSelectProcess, showROCC, showNA }) {
  const [activeFilter, setActiveFilter] = useState(null);
  const memberProcesses = processes.filter(p =>
    p.participants.some(pid => member.absorbs.includes(pid))
  );
  const absorbedRoles = (member.absorbs || []).map(rid => roles.find(r => r.id === rid)).filter(Boolean);

  const mapRespToProcesses = (resp) => {
    const r = resp.toLowerCase();
    const matched = [];
    memberProcesses.forEach(p => {
      const cm =
        (r.includes("back charge") || r.includes("backcharge")) && p.id === "back_charge" ||
        (r.includes("change order") && !r.includes("budget")) && p.id === "change_order_request" ||
        (r.includes("change order") && r.includes("budget")) && p.id === "change_order_budget" ||
        (r.includes("budget") && r.includes("revision")) && p.id === "budget_revision" ||
        (r.includes("budget") && r.includes("weekly")) && p.id === "budget_review" ||
        (r.includes("budget") && (r.includes("spec") || r.includes("sales price"))) && p.id === "budget_spec" ||
        (r.includes("work order") || r.includes("work orders") || r.includes("purchase order")) && (p.id === "work_order_ap" || p.id === "new_work_order") ||
        (r.includes("bonus") || r.includes("occ and sub") || r.includes("walk through") || r.includes("occupancy")) && p.id === "bonus_request" ||
        (r.includes("permit") || r.includes("rescheck") || r.includes("impact fee")) && p.id === "permitting" ||
        (r.includes("start memo") || r.includes("start packet") || r.includes("start date")) && (p.id === "permitting" || p.id === "start_packet") ||
        (r.includes("redline") || r.includes("blueprints")) && (p.id === "preconstruction_redline" || p.id === "preconstruction_planning") ||
        (r.includes("pre-construction") || r.includes("preconstruction") || r.includes("precon")) && (p.id === "preconstruction_planning" || p.id === "preconstruction_spec") ||
        (r.includes("hoa") || r.includes("rocc")) && (p.id === "interior_designer_hoa_rocc" || p.id === "interior_designer_selection" || p.id === "start_packet") ||
        (r.includes("bid") || r.includes("subcontractor")) && (p.id === "new_work_order" || p.id === "start_packet" || p.id === "work_order_ap") ||
        (r.includes("mirror") || r.includes("verno") || r.includes("brandon")) && p.id === "framed_mirror_purchase" ||
        (r.includes("quickbooks") || r.includes("quick books")) && (p.id === "budget_review" || p.id === "back_charge" || p.id === "change_order_budget") ||
        (r.includes("plan") && r.includes("architect")) && (p.id === "start_packet" || p.id === "preconstruction_planning" || p.id === "president_plan_selection") ||
        (r.includes("contract") && (r.includes("binder") || r.includes("copies") || r.includes("distribute"))) && (p.id === "in_house_contract" || p.id === "preconstruction_redline") ||
        (r.includes("title company") || r.includes("closing") || r.includes("hud") || r.includes("mls")) && p.id === "in_house_contract" ||
        (r.includes("welcome packet") || r.includes("welcome gift")) && p.id === "in_house_contract" ||
        (r.includes("marketing spec")) && p.id === "budget_spec" ||
        (r.includes("proforma")) && p.id === "preconstruction_planning" ||

      <div style={{
        marginTop: 32, padding: "16px 20px",
        background: "rgba(15, 23, 42, 0.5)",
        borderRadius: 10, border: "1px solid rgba(148, 163, 184, 0.06)",
        display: "flex", justifyContent: "space-around", flexWrap: "wrap", gap: 16,
      }}>
        {team.map(function(m) {
          return (
            <div key={m.id} style={{ textAlign: "center", minWidth: 80 }}>
              <div style={{ fontSize: 20, fontWeight: 700, color: m.color || "#64748B", fontFamily: "'Space Mono', monospace" }}>
                {(m.responsibilities || []).length}
              </div>
              <div style={{ fontSize: 10, color: "#94A3B8", marginTop: 2 }}>
                {m.name || m.title}
              </div>
              <div style={{
                marginTop: 4, height: 4, borderRadius: 2,
                background: (m.color || "#64748B") + "22", overflow: "hidden",
              }}>
                <div style={{
                  height: "100%", borderRadius: 2,
                  background: m.color || "#64748B",
                  width: ((m.responsibilities || []).length / Math.max.apply(null, team.map(function(t) { return (t.responsibilities || []).length; })) * 100) + "%",
                }} />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(MCHOpsHub));
  </script>
</body>
</html>
